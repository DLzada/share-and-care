spring:
  application:
    name: share-and-care
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

    flyway:
      enabled: true
      baseline-on-migrate: true
    jwt:
      expiration: ${JWT_EXPIRATION:600000}
      key: ${JWT_KEY}
